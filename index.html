<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조 배치 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f3f8;
  --card: #fff;
  --primary: #1a3ab0;
  --primary-light: #2a5cd8;
  --primary-dark: #1a2a6c;
  --green: #2e7d32;
  --red: #c62828;
  --yellow: #f57f17;
  --blue: #1565c0;
  --orange: #e65100;
  --text: #1a1f2e;
  --text2: #4a5568;
  --text3: #8899aa;
  --border: rgba(26,58,176,0.12);
  --shadow: 0 2px 12px rgba(26,58,176,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── TOPBAR (헤더) ── */
header {
  background: linear-gradient(135deg, #1a2a6c, #1a3ab0);
  padding: 6px 14px;
  display: flex; flex-direction: column; justify-content: center;
  box-shadow: 0 2px 12px rgba(26,42,108,.3);
}
.header-inner { width: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
/* 1행: 타이틀 + 우측 박스들 */
.header-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
/* 2행: 토글 */
.header-row2 { display: flex; align-items: center; }
.header-left { min-width: 0; flex-shrink: 1; }
.title { color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
.subtitle { color: #90caf9; font-size: 10px; font-weight: 300; letter-spacing: 1px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* 헤더 날짜/회차 박스 */
.hbox { text-align: center; border-radius: 8px; padding: 4px 10px; white-space: nowrap; cursor: pointer; transition: all .15s; }
.hbox:hover { opacity: .85; transform: translateY(-1px); }
.hbox-orange { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); }
.hbox-blue   { background: rgba(255,255,255,.1);  border: 1px solid rgba(255,255,255,.2); }
.hbox-num { display: block; font-size: 14px; font-weight: 900; color: #fff; line-height: 1.2; }
.hbox-lbl { display: block; font-size: 9px; color: rgba(255,255,255,.6); }

/* 초기화 버튼 */
.btn-reset-header { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); border-radius: 7px; color: #fff; font-size: 14px; font-weight: 900; padding: 4px 8px; cursor: pointer; transition: all .15s; flex-shrink: 0; }
.btn-reset-header:hover { background: rgba(255,100,100,.3); }

/* 표시모드 세그먼트 버튼 */
.mode-seg { display:flex; align-items:center; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:8px; overflow:hidden; }
.mode-btn { border:none; background:transparent; color:rgba(255,255,255,.6); font-size:10px; font-weight:700; font-family:'Noto Sans KR',sans-serif; padding:5px 9px; cursor:pointer; transition:all .18s; white-space:nowrap; border-right:1px solid rgba(255,255,255,.15); }
.mode-btn:last-child { border-right:none; }
.mode-btn.active { background:rgba(255,255,255,.25); color:#fff; }
.mode-btn:hover:not(.active) { background:rgba(255,255,255,.12); color:rgba(255,255,255,.85); }

/* ── CTRL BAR ── */
.ctrl-bar { background: #fff; border-bottom: 1px solid var(--border); padding: 7px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: var(--shadow); }
.btn { padding: 6px 14px; border-radius: 7px; border: none; cursor: pointer; font-size: 12px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; transition: all .18s; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-random { background: linear-gradient(135deg, var(--primary-light), var(--primary)); color: #fff; box-shadow: 0 2px 8px rgba(26,58,176,.3); letter-spacing: .5px; }
.btn-print { background: #fff; color: var(--primary); border: 1.5px solid var(--primary); }
.btn-print:hover { background: #f0f4ff; }
.btn-random:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(26,58,176,.4); }
.btn-save { background: linear-gradient(135deg, #43a047, var(--green)); color: #fff; box-shadow: 0 2px 8px rgba(46,125,50,.25); display: none; }
.btn-save.show { display: inline-block; }
.ctrl-sep { width: 1px; height: 22px; background: var(--border); }
.ctrl-lbl { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .5px; }

/* ── NAV TABS ── */
nav { background: #fff; border-bottom: 2px solid var(--border); padding: 0 10px; display: flex; }
.nav-btn { background: none; border: none; border-bottom: 3px solid transparent; color: var(--text3); padding: 9px 12px; cursor: pointer; font-size: 11px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; margin-bottom: -2px; transition: all .18s; white-space: nowrap; letter-spacing: .3px; }
.nav-btn:hover { color: var(--primary); }
.nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

main { max-width: 980px; margin: 0 auto; padding: 10px 6px 40px; }
.tab { display: none; }
.tab.active { display: block; }

/* ── 교실 배치도 ── */
.classroom-wrap { background: var(--card); border-radius: 12px; padding: 8px; box-shadow: var(--shadow); border: 1px solid var(--border); }

/* 회차 배너 */
.round-banner { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, #1a2a6c, #1a3ab0); border-radius: 9px; padding: 8px 14px; margin-bottom: 12px; flex-wrap: wrap; gap: 4px; }
.banner-l { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.banner-round { font-size: 13px; font-weight: 900; color: #fff; letter-spacing: .5px; }
.banner-date { font-size: 12px; font-weight: 700; color: #90caf9; }
.banner-r { font-size: 10px; color: rgba(255,255,255,.5); }
.badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
.badge-fixed   { background: rgba(255,253,180,.9); color: #7a5c00; }
.badge-random  { background: rgba(200,245,200,.9); color: #1b5e20; }
.badge-pending { background: rgba(255,235,180,.9); color: #7a4000; }

/* 강대상 */
.podium { text-align: center; background: linear-gradient(135deg, #e8edf8, #d0daf5); border: 1px solid rgba(26,58,176,.25); border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 900; color: var(--primary-dark); letter-spacing: 3px; margin-bottom: 10px; }

/* 3블록 */
.blocks-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 10px; }
.door { text-align: center; background: #f8fafc; border: 1px dashed rgba(26,58,176,.2); border-radius: 8px; padding: 7px; font-size: 11px; color: var(--text3); font-weight: 600; }

.block-col { border-radius: 9px; border: 1.5px solid; overflow: hidden; }
.block-col.b1 { border-color: rgba(230,81,0,.5); }
.block-col.b2 { border-color: rgba(46,125,50,.5); }
.block-col.b3 { border-color: rgba(21,101,192,.5); }

.block-title { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; font-size: clamp(9px,2.5vw,11px); font-weight: 900; border-bottom: 1.5px solid; white-space: nowrap; overflow: hidden; }
.b1 .block-title { background: #fff3e0; border-color: rgba(230,81,0,.4); color: var(--orange); }
.b2 .block-title { background: #e8f5e9; border-color: rgba(46,125,50,.4); color: var(--green); }
.b3 .block-title { background: #e3f0ff; border-color: rgba(21,101,192,.4); color: var(--blue); }
.block-range { font-size: clamp(7px,1.8vw,9px); opacity: .7; font-weight: 600; }

.col-head { display: grid; grid-template-columns: 16px 1fr 1fr; padding: 3px 4px; font-size: clamp(7px,2vw,9px); font-weight: 800; background: #f0f4ff; border-bottom: 1px solid var(--border); text-align: center; }
.h-jo { color: var(--text3); } .h-a { color: var(--red); } .h-b { color: var(--blue); }

.seat-row { display: grid; grid-template-columns: 16px 1fr 1fr; padding: 3px 4px; font-size: clamp(7px,2vw,10px); border-bottom: 1px solid var(--border); align-items: center; transition: background .1s; }
.seat-row:last-child { border-bottom: none; }
.seat-row:hover { background: #f7f9ff; }
.jo-num { font-weight: 900; font-size: clamp(7px,2vw,10px); text-align: center; }
.b1 .jo-num { color: var(--orange); } .b2 .jo-num { color: var(--green); } .b3 .jo-num { color: var(--blue); }

/* 이름 셀: 줄바꿈 허용 + 폰트 자동 축소 */
.name-a, .name-b {
  font-weight: 600;
  text-align: center;
  font-size: clamp(7px, 2.5vw, 10px);
  line-height: 1.3;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.name-a { color: #7f1d1d; }
.name-b { color: #1e3a8a; }

.sc { font-size: clamp(6px,1.8vw,8px); font-weight: 700; }
.sc-high { color: var(--green); } .sc-mid { color: var(--orange); } .sc-zero { color: var(--red); }
.gtag { font-size: clamp(7px,2vw,9px); font-weight: 900; cursor: pointer; text-decoration: underline dotted; }
.gtag:hover { opacity: .7; }
.gtag-m { color: var(--blue); } .gtag-f { color: #c2185b; } .gtag-none { color: #ccc; }

/* ── 목록 탭 ── */
.list-blocks { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.list-block { background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
.list-block.b1 { border-top: 3px solid var(--orange); }
.list-block.b2 { border-top: 3px solid var(--green); }
.list-block.b3 { border-top: 3px solid var(--blue); }

/* 블록 제목 */
.list-block-header { padding: 8px 10px 6px; }
.list-block-name { font-size: 13px; font-weight: 900; }
.list-block.b1 .list-block-name { color: var(--orange); }
.list-block.b2 .list-block-name { color: var(--green); }
.list-block.b3 .list-block-name { color: var(--blue); }
.list-block-range { font-size: 10px; color: var(--text3); font-weight: 600; margin-top: 1px; }

/* 컬럼 헤더 */
.list-col-head { display: grid; grid-template-columns: 28px 22px 1fr 14px 22px 1fr; gap: 1px; padding: 4px 8px; background: #f0f4ff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 800; letter-spacing: .3px; }
.list-col-head .lh-jo  { color: var(--text3); }
.list-col-head .lh-ag  { color: var(--red);   text-align: center; }
.list-col-head .lh-an  { color: var(--red);   }
.list-col-head .lh-sep { color: transparent; }
.list-col-head .lh-bg  { color: var(--blue);  text-align: center; }
.list-col-head .lh-bn  { color: var(--blue);  }

/* 조 행: 조번호(28) | A성별(22) | A번호+이름(1fr) | +(14) | B성별(22) | B번호+이름(1fr) */
.list-jo-row { display: grid; grid-template-columns: 28px 22px 1fr 14px 22px 1fr; gap: 1px; padding: 5px 8px; border-bottom: 1px solid var(--border); align-items: center; transition: background .1s; }
.list-jo-row:last-child { border-bottom: none; }
.list-jo-row:hover { background: #f7f9ff; }

.list-jo-num { font-size: clamp(9px,2vw,11px); font-weight: 900; white-space: nowrap; }
.list-block.b1 .list-jo-num { color: var(--orange); }
.list-block.b2 .list-jo-num { color: var(--green); }
.list-block.b3 .list-jo-num { color: var(--blue); }

/* 성별 셀 — 항상 같은 자리 */
.list-gender-a { font-size: clamp(9px,2vw,10px); font-weight: 900; text-align: center; white-space: nowrap; }
.list-gender-b { font-size: clamp(9px,2vw,10px); font-weight: 900; text-align: center; white-space: nowrap; }
.lg-m { color: var(--blue); }
.lg-f { color: #c2185b; }
.lg-n { color: #ccc; }

/* 이름+번호 셀 */
.list-name-a { font-size: clamp(9px,2vw,11px); font-weight: 700; color: #7f1d1d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-name-b { font-size: clamp(9px,2vw,11px); font-weight: 700; color: #1e3a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-plus { font-size: 9px; color: var(--text3); text-align: center; }

/* ── 명단 탭 ── */
.member-section { display: flex; flex-direction: column; gap: 14px; }
.member-group { background: var(--card); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; box-shadow: var(--shadow); }
.member-title { padding: 10px 14px; font-weight: 900; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.mt-a { background: linear-gradient(135deg, #fdecea, #fff); color: var(--red); border-left: 3px solid var(--red); }
.mt-b { background: linear-gradient(135deg, #e3f0ff, #fff); color: var(--blue); border-left: 3px solid var(--blue); }
.stat-row { font-size: 11px; font-weight: 600; color: var(--text2); }
.member-grid { display: flex; flex-direction: column; padding: 0; }
.member-card { display: grid; grid-template-columns: 22px 40px 1fr 36px 48px; align-items: center; gap: 6px; padding: 7px 12px; border-bottom: 1px solid var(--border); background: #fff; transition: background .1s; }
.member-card:last-child { border-bottom: none; }
.member-card:hover { background: #f7f9ff; }
.mc-top { display: contents; } .mc-bot { display: contents; }
.mc-id { font-size: 10px; color: var(--text3); text-align: center; }
.mc-num { font-size: 11px; font-weight: 700; background: #f0f4ff; border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; color: var(--primary); text-align: center; cursor: pointer; white-space: nowrap; }
.mc-num:hover { background: #dce6f7; color: var(--primary-dark); }
.mc-name { font-size: 13px; font-weight: 700; color: var(--text); cursor: pointer; border-bottom: 1px dashed var(--border); }
.mc-name:hover { color: var(--primary); border-bottom-color: var(--primary); }
.mc-score { font-size: 11px; font-weight: 700; text-align: center; color: var(--text2); }
.gender-btn { font-size: 11px; font-weight: 800; padding: 3px 6px; border-radius: 6px; border: none; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all .15s; width: 100%; }
.gender-m { background: #e3f0ff; color: var(--blue); }
.gender-f { background: #fce4ec; color: #c2185b; }
.gender-none { background: #f0f4ff; color: var(--text3); border: 1px dashed var(--border); }
.edit-input { font-size: 12px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; border: 2px solid var(--primary); border-radius: 6px; padding: 2px 6px; outline: none; width: 100%; }

/* CSV 바 */
.save-notice { font-size: 11px; color: var(--green); font-weight: 700; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 6px; padding: 6px 12px; display: none; }
.save-notice.show { display: block; }
.csv-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; background: #f0f4ff; border:1px solid var(--border); border-radius:9px; padding:9px 12px; }
.csv-bar-label { font-size:11px; font-weight:700; color:var(--primary); }
.btn-csv-dl { background:var(--primary); color:#fff; font-size:11px; padding:6px 12px; border-radius:7px; border:none; cursor:pointer; font-weight:700; font-family:'Noto Sans KR',sans-serif; }
.btn-csv-dl:hover { background:var(--primary-light); }
.btn-csv-ul { background:var(--blue); color:#fff; font-size:11px; padding:6px 12px; border-radius:7px; border:none; cursor:pointer; font-weight:700; font-family:'Noto Sans KR',sans-serif; }
.btn-csv-ul:hover { background:#1976d2; }
.csv-hint { font-size:10px; color:var(--text3); }
.csv-msg { font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; display:none; }
.btn-csv-reset { background:#fdecea; color:var(--red); font-size:11px; padding:6px 12px; border-radius:7px; border:1px solid rgba(198,40,40,.2); cursor:pointer; font-weight:700; font-family:'Noto Sans KR',sans-serif; }
.btn-csv-reset:hover { background:#ffcdd2; }
.csv-msg.show { display:inline-block; }
.csv-msg.ok { background:#e8f5e9; color:var(--green); border:1px solid #a5d6a7; }
.csv-msg.err { background:#fdecea; color:var(--red); border:1px solid #ef9a9a; }

/* ── 회차 이력 ── */
.history-list { display: flex; flex-direction: column; gap: 8px; }
details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
details summary { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; list-style: none; user-select: none; transition: background .1s; }
details summary:hover { background: #f7f9ff; }
details summary::-webkit-details-marker { display: none; }
.hist-round { font-weight: 900; font-size: 13px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
.hist-meta { font-size: 11px; color: var(--text3); }
.hist-content { padding: 12px 16px; border-top: 1px solid var(--border); background: #fafbff; }
.hist-blocks-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.mini-block-title { font-size: 11px; font-weight: 900; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); color: var(--primary); }
.mini-row { display: flex; gap: 4px; align-items: center; font-size: 10px; padding: 2px 0; }
.mini-jo { color: var(--text3); min-width: 24px; }
.mini-a { color: #7f1d1d; font-weight: 600; }
.mini-b { color: #1e3a8a; font-weight: 600; }
.mini-sep { color: var(--border); }

/* 회차 선택 팝업 */
.btn-reset-header { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); border-radius:7px; color:#fff; font-size:13px; font-weight:900; padding:4px 8px; cursor:pointer; transition:all .15s; flex-shrink:0; }
.btn-reset-header:hover { background:rgba(255,100,100,.3); }
.round-picker-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:998; }
.round-picker-box { position:fixed; top:58px; right:14px; z-index:9999; background:#fff; border-radius:12px; box-shadow:0 8px 32px rgba(26,42,108,.25); overflow:hidden; min-width:170px; border:1px solid var(--border); }
.round-picker-title { padding:9px 14px; font-size:11px; font-weight:800; color:var(--primary); background:#f0f4ff; border-bottom:1px solid var(--border); letter-spacing:.5px; }
.round-picker-item { padding:10px 14px; font-size:12px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid var(--border); transition:background .1s; color:var(--text); }
.round-picker-item:last-child { border-bottom:none; }
.round-picker-item:hover { background:#f0f4ff; }
.round-picker-item.active { background:#dce6f7; color:var(--primary); }
.rpi-date { font-size:10px; color:var(--text3); font-weight:600; }
.round-picker-item.active .rpi-date { color:#90caf9; }

/* 토스트 */
.status-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--primary); color:#fff; padding:8px 20px; border-radius:20px; font-size:12px; z-index:300; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; box-shadow:0 4px 16px rgba(26,58,176,.3); }
.status-toast.show { opacity:1; }

/* set 배지 */
.set-badge { display:inline-block; font-size:8px; font-weight:900; padding:1px 4px; border-radius:4px; margin-left:3px; vertical-align:middle; }
.set-1 { background:#fff3e0; color:#e65100; border:1px solid rgba(230,81,0,.3); }
.set-2 { background:#e8f5e9; color:#2e7d32; border:1px solid rgba(46,125,50,.3); }
.set-3 { background:#e3f0ff; color:#1565c0; border:1px solid rgba(21,101,192,.3); }
.set-4 { background:#f3e5f5; color:#7b1fa2; border:1px solid rgba(123,31,162,.3); }

@keyframes spin { to { transform: rotate(360deg); } }

/* ── 인쇄 스타일 ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; }
  header, .ctrl-bar, nav, #tab-list, #tab-members, #tab-history, .round-banner, .door { display: none !important; }
  main { padding: 0 !important; }
  .tab { display: block !important; }
  #tab-map { display: block !important; }
  .classroom-wrap { box-shadow: none !important; border: none !important; padding: 0 !important; }
  .print-header { display: block !important; }
  .blocks-row { gap: 6px !important; }
  .block-col { break-inside: avoid; }
  .seat-row { padding: 3px 5px !important; }
}
.print-header { display: none; text-align: center; margin-bottom: 12px; }
.print-header h2 { font-size: 18px; font-weight: 900; color: #1a2a6c; letter-spacing: 2px; }

<script>
// ─── 기본 명단 ────────────────────────────────────
const DEFAULT_A = [
  {n:"김은희",s:5,g:"f",no:"1"},{n:"김유리",s:5,g:"f",no:"3"},{n:"유세미",s:5,g:"f",no:"5"},
  {n:"백재영",s:5,g:"f",no:"7"},{n:"지은주",s:5,g:"f",no:"9"},{n:"강영숙",s:5,g:"f",no:"11"},
  {n:"장은숙",s:5,g:"f",no:"13"},{n:"이태임",s:5,g:"f",no:"15"},{n:"오수희",s:5,g:"f",no:"17"},
  {n:"이희정",s:5,g:"f",no:"19"},{n:"임순정",s:3,g:"f",no:"21"},{n:"송지연",s:5,g:"f",no:"23"},
  {n:"김윤희",s:2,g:"f",no:"25"},{n:"전준철",s:5,g:"m",no:"27"},{n:"임도아",s:4,g:"f",no:"29"},
  {n:"심의라",s:5,g:"",no:"31"},{n:"마경준",s:5,g:"m",no:"33"},{n:"원종섭",s:5,g:"m",no:"35"},
  {n:"이민아",s:5,g:"f",no:"37"},{n:"전보장",s:2,g:"f",no:"39"},{n:"오진영",s:3,g:"f",no:"41"},
  {n:"이화숙",s:5,g:"f",no:"43"}
];
const DEFAULT_B = [
  {n:"박진수",s:0,g:"m",no:"2"},{n:"김영원",s:0,g:"m",no:"4"},{n:"허성준",s:0,g:"m",no:"6"},
  {n:"정성현",s:0,g:"m",no:"8"},{n:"김헤세",s:0,g:"m",no:"10"},{n:"김도건",s:0,g:"m",no:"12"},
  {n:"이준택",s:0,g:"m",no:"14"},{n:"안태성",s:0,g:"m",no:"16"},{n:"황준규",s:0,g:"m",no:"18"},
  {n:"이재림",s:0,g:"m",no:"20"},{n:"정수만",s:0,g:"m",no:"22"},{n:"서대인",s:0,g:"m",no:"24"},
  {n:"김진원",s:0,g:"m",no:"26"},{n:"김태연",s:2,g:"f",no:"28"},{n:"김혜연",s:0,g:"m",no:"30"},
  {n:"구을영",s:2,g:"f",no:"32"},{n:"홍은숙",s:0,g:"f",no:"34"},{n:"김순자",s:2,g:"f",no:"36"},
  {n:"홍성희",s:2,g:"m",no:"38"},{n:"신준식",s:0,g:"",no:"40"},{n:"오앵숙",s:2,g:"f",no:"42"},
  {n:"남미정",s:1,g:"f",no:"44"}
];

// ─── 로컬스토리지 로드/저장 ───────────────────────
function loadMembers(){
  return {
    A: JSON.parse(JSON.stringify(DEFAULT_A)),
    B: JSON.parse(JSON.stringify(DEFAULT_B))
  };
}
function saveMembers(){
  // 메모리에만 저장 (로컬스토리지 미사용)
  showSaveNotice();
}

let { A, B } = loadMembers();

// ─── 상수 ─────────────────────────────────────────
const BLOCKS = [
  {name:"1블록",cls:"b1",from:1, to:7 },
  {name:"2블록",cls:"b2",from:8, to:14},
  {name:"3블록",cls:"b3",from:15,to:22},
];
const DATES      = ["6/8","6/9","6/10","6/11","6/12"];
const DATE_KO    = {"6/8":"6월 8일","6/9":"6월 9일","6/10":"6월 10일","6/11":"6월 11일","6/12":"6월 12일"};
const BG         = ["#fff7ed","#f0fdf4","#eff6ff"];
const BC         = ["#f97316","#22c55e","#3b82f6"];
const FC         = ["#ea580c","#16a34a","#2563eb"];

// ── Set 정의 (고유번호 기준) ──
const SET_OF = {};
[1,2,3,4,15,16,17,18,29,30,31,32].forEach(n=>SET_OF[n]=1);
[5,6,7,8,19,20,21,22,33,34,35,36].forEach(n=>SET_OF[n]=2);
[9,10,11,12,23,24,25,26,37,38,39,40].forEach(n=>SET_OF[n]=3);
[13,14,27,28,41,42,43,44].forEach(n=>SET_OF[n]=4);

// ── Set 블록 단위 순환 ──
// 월(6/8):  S1=1블록, S2=2블록, S3=3블록, S4=혼합(각블록 1,1,2명)
// 화(6/9):  S4=1블록, S1=2블록, S2=3블록, S3=혼합(3,1,2명)
// 수(6/10): S3=1블록, S4=2블록, S1=3블록, S2=혼합(1,3,2명)
// 목(6/11): S2=1블록, S3=2블록, S4=3블록, S1=혼합(1,1,4명)
// 금(6/12): S1=1블록, S2=2블록, S3=3블록, S4=혼합(1,1,2명)
//
// 날짜  | 1블록(앞,7)      | 2블록(중,7)      | 3블록(뒤,8)
// 6/8   | S1(6)+S4(1)     | S2(6)+S4(1)     | S3(6)+S4(2)
// 6/9   | S4(4)+S3(3)     | S1(6)+S3(1)     | S2(6)+S3(2)
// 6/10  | S3(6)+S2(1)     | S4(4)+S2(3)     | S1(6)+S2(2)
// 6/11  | S2(6)+S1(1)     | S3(6)+S1(1)     | S4(4)+S1(4)
// 6/12  | S1(6)+S4(1)     | S2(6)+S4(1)     | S3(6)+S4(2)

// blocks: 각 블록의 [주set, 혼합set에서 가져올 인원수]
// mix: 혼합 set 번호
const DAY_BLOCK_PLAN = {
  "6/8":  { blocks: [[1,4,1],[2,4,1],[3,4,2]], mix:4 },
  "6/9":  { blocks: [[4,3,3],[1,3,1],[2,3,2]], mix:3 },
  "6/10": { blocks: [[3,2,1],[4,2,3],[1,2,2]], mix:2 },
  "6/11": { blocks: [[2,1,1],[3,1,1],[4,1,4]], mix:1 },
  "6/12": { blocks: [[1,4,1],[2,4,1],[3,4,2]], mix:4 },
};
// blocks 각 항목: [주set번호, 혼합set번호, 혼합인원수]

const BLOCK_RANGES = [
  {from:1,  to:7 },
  {from:8,  to:14},
  {from:15, to:22},
];

// 멤버의 set 번호 반환
function setOf(name, grp){
  const mem = (grp==='A'?A:B).find(m=>m.n===name);
  if(!mem||!mem.no) return 0;
  return SET_OF[parseInt(mem.no)] || 0;
}

function blockOf(jo){ return BLOCKS.find(b=>jo>=b.from&&jo<=b.to); }

// 6/8 고정 1회차
const ROUND1 = A.map((a,i)=>({jo:i+1,block:blockOf(i+1).name,a:a.n,b:B[i].n}));
let history = [{date:"6/8",rows:ROUND1,fixed:true}];
let displayRows = [...ROUND1];
let pendingRows = null;
let pendingDate = null;

// ─── 유틸 ─────────────────────────────────────────
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function sl(s){ return s===0?'x':String(s); }
function sc(s){ return s===0?'sc-zero':s>=4?'sc-high':'sc-mid'; }
function getMem(name,grp){ return (grp==='A'?A:B).find(m=>m.n===name); }
function grouped(rows){ return BLOCKS.map(b=>({...b,rows:rows.filter(r=>r.block===b.name)})); }
function nextDate(){
  const last=history[history.length-1].date;
  const i=DATES.indexOf(last);
  return i<DATES.length-1?DATES[i+1]:null;
}

// 표시 모드: 0=ID(성별), 1=성별)이름(단계), 2=성별)이름
let displayMode = 0;

function setDisplayMode(mode){
  displayMode = mode;
  [0,1,2].forEach(i=>{
    const btn = document.getElementById('modeBtn'+i);
    if(btn) btn.classList.toggle('active', i===mode);
  });
  renderMap(); renderList(); renderHistory();
}

// 이름 표시
function nameTag(name, grp){
  const list = grp==='A'?A:B;
  const mem = list.find(x=>x.n===name);
  if(!mem) return name;
  const g=mem.g, s=mem.s, idx=list.indexOf(mem);
  const gClick = `onclick="toggleGenderByName('${grp}',${idx})"`;
  let gTag='';
  if(g==='m')      gTag=`<span class="gtag gtag-m" ${gClick}>남)</span>`;
  else if(g==='f') gTag=`<span class="gtag gtag-f" ${gClick}>여)</span>`;
  else             gTag=`<span class="gtag gtag-none" ${gClick}>-)</span>`;

  if(displayMode===0){
    // ID표시: 번호 + (성별)
    const gLabel = g==='m'?'남':g==='f'?'여':'-';
    const gColor = g==='m'?'#1d4ed8':g==='f'?'#be185d':'#cbd5e1';
    const idStr = mem.no ? `<span style="font-size:9px;font-weight:800;color:#475569">${mem.no}</span>` : '';
    const gStr = `<span class="gtag" style="color:${gColor};cursor:pointer;text-decoration:underline dotted" ${gClick}>(${gLabel})</span>`;
    return `${idStr}&nbsp;${gStr}`;
  } else if(displayMode===1){
    // 성별)이름(단계)
    return `${gTag}${name}<span class="sc ${sc(s)}"> (${sl(s)})</span>`;
  } else {
    // 성별)이름
    return `${gTag}${name}`;
  }
}


function toggleGenderByName(grp,idx){
  const list=grp==='A'?A:B;
  const cur=list[idx].g;
  list[idx].g = cur===''?'m':cur==='m'?'f':'';
  saveMembers();
  renderMap(); renderList(); renderHistory();
  // 명단 탭 버튼도 갱신
  const btn=document.getElementById('gbtn-'+grp+'-'+idx);
  if(btn){ btn.className=gBtnClass(list[idx].g); btn.textContent=gBtnLbl(list[idx].g); }
  refreshStats();
}

// ─── 배정 ─────────────────────────────────────────
function assignGroups(){
  const nd = nextDate();
  if(!nd) return [];

  const plan = DAY_BLOCK_PLAN[nd] || DAY_BLOCK_PLAN["6/8"];

  // 이전 회차 기록
  const usedPair = new Set();
  const usedJoA  = {};
  const usedJoB  = {};
  history.forEach(h=>h.rows.forEach(r=>{
    usedPair.add(r.a+'§'+r.b);
    if(!usedJoA[r.jo]) usedJoA[r.jo]=new Set();
    usedJoA[r.jo].add(r.a);
    if(!usedJoB[r.jo]) usedJoB[r.jo]=new Set();
    usedJoB[r.jo].add(r.b);
  }));

  function maleMale(a,b){ return getMem(a,'A')?.g==='m' && getMem(b,'B')?.g==='m'; }

  // set별 A/B 멤버
  const aBySet={1:[],2:[],3:[],4:[]};
  const bBySet={1:[],2:[],3:[],4:[]};
  A.forEach(m=>{ const s=SET_OF[parseInt(m.no)]; if(s) aBySet[s].push(m.n); });
  B.forEach(m=>{ const s=SET_OF[parseInt(m.no)]; if(s) bBySet[s].push(m.n); });

  function tryOnce(){
    const result = new Array(22);

    // 혼합 set 미리 셔플 (3블록에서 나눠 쓸 것)
    const mixA = shuffle([...aBySet[plan.mix]]);
    const mixB = shuffle([...bBySet[plan.mix]]);
    let mixAi=0, mixBi=0;

    for(let bi=0; bi<3; bi++){
      const [mainS, , mixCnt] = plan.blocks[bi];
      const blk = BLOCK_RANGES[bi];

      // 주 set + 혼합 set 일부
      const aPool = [...shuffle([...aBySet[mainS]]), ...mixA.slice(mixAi, mixAi+mixCnt)];
      const bPool = [...shuffle([...bBySet[mainS]]), ...mixB.slice(mixBi, mixBi+mixCnt)];
      mixAi += mixCnt;
      mixBi += mixCnt;

      const size = blk.to - blk.from + 1;
      for(let i=0; i<size; i++){
        const jo = blk.from + i;
        if(!aPool[i]||!bPool[i]) return null;
        result[jo-1] = { jo, block: blockOf(jo).name, a: aPool[i], b: bPool[i] };
      }
    }
    return result;
  }

  function isValid(rows, level){
    if(!rows) return false;
    for(const r of rows){
      if(!r||!r.a||!r.b)                          return false;
      if(usedPair.has(r.a+'§'+r.b))               return false;
      if(level>=2 && usedJoA[r.jo]?.has(r.a))     return false;
      if(level>=2 && usedJoB[r.jo]?.has(r.b))     return false;
      if(level>=1 && maleMale(r.a,r.b))            return false;
    }
    return true;
  }

  for(let t=0;t<5000;t++){ const r=tryOnce(); if(isValid(r,2)) return r; }
  for(let t=0;t<2000;t++){ const r=tryOnce(); if(isValid(r,1)) return r; }
  for(let t=0;t<500;t++){  const r=tryOnce(); if(isValid(r,0)) return r; }
  return tryOnce() || [];
}

function doAssign(){
  const nd=nextDate();
  if(!nd){ alert("6/12까지 모든 회차가 완료되었습니다!"); return; }
  const btn=document.getElementById('btnAssign');
  btn.disabled=true; btn.innerHTML='<span class="spinning">🔀</span> 배정 중...';
  setTimeout(()=>{
    const result=assignGroups();
    pendingRows=result; pendingDate=nd; displayRows=[...result];
    btn.disabled=false; btn.innerHTML='🎲 랜덤 배정';
    document.getElementById('btnSave').classList.add('show');
    renderMap(); renderList();
    showTab('map',document.querySelector('.nav-btn'));
  },500);
}

function doSave(){
  if(!pendingRows) return;
  const ei=history.findIndex(h=>h.date===pendingDate);
  if(ei>=0) history[ei]={date:pendingDate,rows:pendingRows,fixed:false};
  else history.push({date:pendingDate,rows:pendingRows,fixed:false});
  history.sort((a,b)=>DATES.indexOf(a.date)-DATES.indexOf(b.date));
  pendingRows=null; pendingDate=null;
  document.getElementById('btnSave').classList.remove('show');
  updateHeader();
  renderHistory();
  showTab('history',document.querySelectorAll('.nav-btn')[3]);
}

// ─── 탭 ──────────────────────────────────────────
function showTab(id,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  if(btn) btn.classList.add('active');
}

function updateHeader(roundIdx){
  // roundIdx 없으면 마지막 회차
  const idx = (roundIdx !== undefined) ? roundIdx : history.length-1;
  const h = history[idx];
  document.getElementById('headerDate').textContent = h.date;
  document.getElementById('headerRound').textContent = idx+1;
  document.getElementById('histBtn').textContent=`🕓 회차 기록 (${history.length})`;
  document.getElementById('savedInfo').textContent=`${history.length}회차 (${history[0].date}~${history[history.length-1].date})`;
}

// 회차 선택 팝업
function showRoundPicker(){
  // 기존 팝업 제거
  const old = document.getElementById('roundPickerWrap');
  if(old){ old.remove(); return; }

  const wrap = document.createElement('div');
  wrap.id = 'roundPickerWrap';

  // 현재 표시 중인 회차 인덱스
  const curIdx = pendingRows ? -1 :
    history.findIndex(h=>h.rows===displayRows) >= 0
    ? history.findIndex(h=>h.rows===displayRows)
    : history.findIndex(h=>JSON.stringify(h.rows)===JSON.stringify(displayRows));

  const bg = document.createElement('div');
  bg.className='round-picker-bg';
  bg.onclick=()=>wrap.remove();

  const box = document.createElement('div');
  box.className='round-picker round-picker-box';
  box.style.cssText='position:fixed;top:60px;right:14px;z-index:9999;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden;min-width:160px;';

  box.innerHTML = `<div class="round-picker-title">📅 회차 선택</div>` +
    history.map((h,i)=>`
      <div class="round-picker-item ${i===curIdx?'active':''}" onclick="goRound(${i});document.getElementById('roundPickerWrap').remove()">
        <span>${i+1}회차 ${h.fixed?'🔒':''}</span>
        <span class="rpi-date">${DATE_KO[h.date]||h.date}</span>

function resetMembers(){

  const fresh = loadMembers();

  renderMembers(); renderMap(); renderList(); renderHistory();
  showCsvMsg('✅ 명단이 초기화되었습니다','ok');
}
function downloadCSV(){
  const BOM = '\uFEFF';
  const header = '그룹,번호,이름,점수,성별';
  const rowsA = A.map(m=>`A,${m.no||''},${m.n},${m.s},${m.g||''}`);
  const rowsB = B.map(m=>`B,${m.no||''},${m.n},${m.s},${m.g||''}`);
  const csv = BOM + [header,...rowsA,...rowsB].join('\n');

  // 모바일/PC 공통 방식
  try {
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '조배치_명단.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
    showCsvMsg('✅ 저장되었습니다 (다운로드 폴더 확인)','ok');
  } catch(e) {
    // 모바일 fallback: 새 탭에서 텍스트로 열기
    showCsvModal(csv);
  }
}

function copyCSV(){
  const ta = document.getElementById('csvText');
  if(!ta) return;
  ta.select();
  try {
    // 모던 방식
    navigator.clipboard.writeText(ta.value).then(()=>{
      showCsvMsg('✅ 복사되었습니다','ok');
      const btn = ta.parentElement.querySelector('button');
    }).catch(()=>{
      document.execCommand('copy');
      showCsvMsg('✅ 복사되었습니다','ok');
    });
  } catch(e) {
    document.execCommand('copy');
    showCsvMsg('✅ 복사되었습니다','ok');
  }
}

function uploadCSV(input){
  const file = input.files[0];
  if(!file){ return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      let text = e.target.result;
      // BOM 제거
      if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
      const lines = text.split(/\r?\n/).filter(l=>l.trim());
      if(!lines.length){ showCsvMsg('❌ 파일이 비어 있습니다','err'); return; }
      // 헤더 스킵
      const start = lines[0].startsWith('그룹') ? 1 : 0;
      const newA=[], newB=[];
      for(let i=start;i<lines.length;i++){
        const cols = lines[i].split(',');
        if(cols.length<3) continue;
        const grp=(cols[0]||'').trim().toUpperCase();
        const no=(cols[1]||'').trim();
        const n=(cols[2]||'').trim();
        const s=parseInt(cols[3])||0;
        const g=(cols[4]||'').trim().toLowerCase();
        if(!n) continue;
        const gVal = g==='m'||g==='남'?'m': g==='f'||g==='여'?'f': '';
        const obj={n,s,g:gVal,no};
        if(grp==='A') newA.push(obj);
        else if(grp==='B') newB.push(obj);
      }
      if(newA.length===0&&newB.length===0){ showCsvMsg('❌ A/B 그룹 데이터가 없습니다','err'); return; }
      if(newA.length>0){ A.length=0; newA.forEach(m=>A.push(m)); }
      if(newB.length>0){ B.length=0; newB.forEach(m=>B.push(m)); }
      saveMembers();
      renderMembers(); renderMap(); renderList(); renderHistory();
      showCsvMsg(`✅ 불러오기 완료 (A:${newA.length}명, B:${newB.length}명)`,'ok');
    } catch(err){
      showCsvMsg('❌ 파일 형식 오류: '+err.message,'err');
    }
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

function showCsvMsg(msg,type){
  const el=document.getElementById('csvMsg');
  if(!el) return;
  el.textContent=msg;
  el.className='csv-msg show '+(type==='ok'?'ok':'err');
  setTimeout(()=>el.classList.remove('show'),3500);
}

// ─── 인쇄 ─────────────────────────────────────────
function printLayout(){
  // 현재 회차 정보로 헤더 업데이트
  const cur = pendingRows
    ? {rows:pendingRows, date:pendingDate, fixed:false}
    : history[history.length-1];
  const ri = history.findIndex(h=>h.date===cur.date);
  const rn = ri>=0 ? ri+1 : history.length+1;
  const subtitle = document.getElementById('printSubtitle');
  if(subtitle) subtitle.textContent = `${rn}회차 · ${DATE_KO[cur.date]||cur.date} · 22조 3블록`;
  window.print();
}

// ─── 회차 이력 ────────────────────────────────────
function renderHistory(){
  document.getElementById('historyView').innerHTML=history.map((h,idx)=>{
    const g=grouped(h.rows);
    return `<details ${idx===history.length-1?'open':''}>
      <summary>
        <span class="hist-round">
          ${idx+1}회차
          <span class="badge ${h.fixed?'badge-fixed':'badge-random'}">${h.fixed?'🔒 고정':'✅ 랜덤'}</span>
        </span>
        <span class="hist-meta">📅 ${DATE_KO[h.date]||h.date} · 22조 ▾</span>
      </summary>
      <div class="hist-content">
        <div class="hist-blocks-row">
          ${g.map((block,bi)=>`
            <div>
              <div class="mini-block-title" style="color:${FC[bi]}">${block.name} (${block.from}~${block.to}조)</div>
              ${block.rows.map(r=>`
                <div class="mini-row">
                  <span class="mini-jo">${r.jo}조</span>
                  <span class="mini-a">${nameTag(r.a,'A')}</span>
                  <span class="mini-sep">+</span>
                  <span class="mini-b">${nameTag(r.b,'B')}</span>
                </div>`).join('')}
            </div>`).join('')}
        </div>
      </div>
    </details>`;
  }).join('');
}

// ─── 초기 실행 ────────────────────────────────────
renderMap();
renderList();
renderMembers();
renderHistory();
updateHeader();
</script>
</body>
</html>
